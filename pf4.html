<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, shrink-to-fit=no">
  <title>JudyNguyen's World</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Georgia:wght@400;700&display=swap">
  <!-- Font Awesome for social icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    body {
      font-family: 'Georgia', serif;
      background: linear-gradient(135deg, #b5b4e4, #f3e5f5);
      margin: 0;
      padding: 20px;
      color: #333;
    }
    .container {
      max-width: 900px;
      margin: auto;
      background: #fff;
      padding: 30px;
      border-radius: 15px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.15);
    }
    .header-table {
      width: 100%;
      border-collapse: collapse;
      margin-bottom: 30px;
    }
    .header-table td {
      vertical-align: middle;
      padding: 20px;
    }
    .avatar-cell {
      width: 150px;
    }
    .avatar {
      width: 150px;
      height: 150px;
      border-radius: 50%;
      object-fit: cover;
      border: 10px solid #e22f5f;
      background-size: cover;
        background-position: center;
    }
    .welcome-message {
      padding-left: 30px;
      border-left: 2px dashed #b5b4e4;
    }
    .welcome-message h2 {
      font-size: 40px;
      margin: 0 0 10px 0;
      color: #4a148c;
      text-align: left;
 
    }

    .welcome-message p {
      font-size: 20px;
      margin: 0;
      color: #d76925;
      text-align: justify;
    }
    h1, h2 {
      text-align: center;
      color: #4a148c;
    }
    .section {
      margin-top: 40px;
    }
    .yt-video {
      width: 100%;
      height: 315px;
      border: none;
      border-radius: 10px;
      margin-bottom: 20px;
    }
    .player-controls {
      display: flex;
      gap: 10px;
      justify-content: center;
      margin: 15px 0;
    }
    button {
      padding: 10px 20px;
      border: none;
      background: #7e57c2;
      color: #fff;
      border-radius: 5px;
      cursor: pointer;
      transition: all 0.3s ease;
    }
    button:hover {
      background: #5e35b1;
      transform: translateY(-2px);
    }
    .playlist-menu {
      background: #f8f5ff;
      border-radius: 10px;
      padding: 15px;
      max-height: 300px;
      overflow-y: auto;
    }
    .song-item {
      padding: 12px 15px;
      margin: 5px 0;
      background: white;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.3s ease;
      border-left: 4px solid transparent;
    }
    .song-item:hover {
      background: #e9e0ff;
      transform: translateX(5px);
      border-left: 4px solid #7e57c2;
    }
    .song-item.active {
      background: #e0d0ff;
      border-left: 4px solid #4a148c;
      font-weight: bold;
    }
    .song-title {
      font-size: 16px;
      color: #4a148c;
    }
    .song-artist {
      font-size: 14px;
      color: #666;
      font-style: italic;
    }
    ::-webkit-scrollbar {
      width: 8px;
    }
    ::-webkit-scrollbar-track {
      background: #f1f1f1;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb {
      background: #b5b4e4;
      border-radius: 10px;
    }
    ::-webkit-scrollbar-thumb:hover {
      background: #9e9ad6;
    }
    .social-links {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-top: 20px;
    }
    .social-links a {
      color: #7e57c2;
      font-size: 24px;
      transition: all 0.3s ease;
    }
    .social-links a:hover {
      color: #4a148c;
      transform: translateY(-3px);
    }
    footer {
      text-align: center;
      margin-top: 30px;
      padding-top: 20px;
      border-top: 1px solid #e0d0ff;
      color: #666;
    }
    footer a {
      color: #7e57c2;
      text-decoration: none;
    }
    footer a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <table class="header-table">
      <tr>
        <td class="avatar-cell">
          <img class="avatar" src="https://raw.githubusercontent.com/Whyrusoserious/Picture/main/2013-12-18%2015.33.03-1.jpg" alt="Judy's Avatar">
        </td>
        <td class="welcome-message">
          <h2>Welcome to my World!</h2>
          <p>This is a place I show you my hobbies</p>
        </td>
      </tr>
    </table>
  
    <h1>JudyNguyen's Music Player</h1>
    
    <div class="section yt-player">
      <div id="yt-player" class="yt-video"></div>
      
      <div class="player-controls">
        <button onclick="playVideo()">▶ Play</button>
        <button onclick="pauseVideo()">⏸ Pause</button>
        <button onclick="stopVideo()">⏹ Stop</button>
        <button onclick="nextVideo()">⏭ Next</button>
      </div>
      
      <h2>My Favorite Playlist</h2>
      <div class="playlist-menu" id="playlist-menu">
        <!-- Songs will be added here by JavaScript -->
      </div>
      
      <div class="social-links">
        <a href="https://www.facebook.com/dieptu.phan" target="_blank" rel="noopener noreferrer" aria-label="Facebook">
          <i class="fab fa-facebook"></i>
        </a>
        <a href="https://github.com/Whyrusoserious" target="_blank" rel="noopener noreferrer" aria-label="GitHub">
          <i class="fab fa-github"></i>
        </a>
        <a href="https://discordapp.com/users/asura3107" target="_blank" rel="noopener noreferrer" aria-label="Discord">
          <i class="fab fa-discord"></i>
        </a>
      </div>
    </div>
    
    <footer>
      Website được tạo với ❤️ bởi <a href="https://github.com/Whyrusoserious" target="_blank" rel="noopener noreferrer">JudyNguyen</a>
    </footer>
  </div>

  <script>
    // YouTube Player API
    let player;
    let currentSongIndex = 0;
    
    // Your favorite songs playlist
    const playlist = [
      { 
        title: "Thank U", 
        artist: "Uknow", 
        videoId: "ZL8jYBVef7U" 
      },
      { 
        title: "Insomnia", 
        artist: "Wheesung", 
        videoId: "1iTT2csCtYY" 
      },
      { 
        title: "Weekend", 
        artist: "JangWooHyuk", 
        videoId: "9vm5YuiueWo" 
      },
      { 
        title: "Love and Deepspace", 
        artist: "Sarah Brightman", 
        videoId: "urONohYpdVA" 
      },
      { 
        title: "Broken Hero", 
        artist: "Elena Westermann ft 2WEI", 
        videoId: "NwEt3cqoYhA" 
      },
      { 
        title: "Tonight", 
        artist: "BIGBANG", 
        videoId: "8d5QEWdHchk" 
      },
      { 
        title: "Huong vi tieu tan", 
        artist: "Cao Huc", 
        videoId: "JGxbvKUsi9Pa4" 
      }
    ];
    
    // Initialize the player and playlist
    function onYouTubeIframeAPIReady() {
      player = new YT.Player('yt-player', {
        height: '315',
        width: '100%',
        videoId: playlist[0].videoId,
        playerVars: {
          'autoplay': 0,
          'controls': 1,
          'rel': 0
        },
        events: {
          'onReady': onPlayerReady,
          'onStateChange': onPlayerStateChange
        }
      });
      
      // Create playlist menu
      renderPlaylist();
    }
    
    function onPlayerReady(event) {
      console.log("YouTube player is ready");
      updateActiveSong();
    }
    
    function onPlayerStateChange(event) {
      // When a song ends, play the next one
      if (event.data === YT.PlayerState.ENDED) {
        nextVideo();
      }
    }
    
    // Player controls
    function playVideo() {
      if (player) player.playVideo();
    }
    
    function pauseVideo() {
      if (player) player.pauseVideo();
    }
    
    function stopVideo() {
      if (player) player.stopVideo();
    }
    
    function nextVideo() {
      currentSongIndex = (currentSongIndex + 1) % playlist.length;
      loadCurrentSong();
    }
    
    function loadCurrentSong() {
      if (player) {
        player.loadVideoById(playlist[currentSongIndex].videoId);
        updateActiveSong();
      }
    }
    
    function loadSong(index) {
      currentSongIndex = index;
      loadCurrentSong();
    }
    
    // Update the active song in playlist
    function updateActiveSong() {
      const items = document.querySelectorAll('.song-item');
      items.forEach((item, index) => {
        if (index === currentSongIndex) {
          item.classList.add('active');
        } else {
          item.classList.remove('active');
        }
      });
    }
    
    // Render the playlist menu
    function renderPlaylist() {
      const menu = document.getElementById('playlist-menu');
      menu.innerHTML = '';
      
      playlist.forEach((song, index) => {
        const item = document.createElement('div');
        item.className = 'song-item';
        item.onclick = () => loadSong(index);
        
        item.innerHTML = `
          <div class="song-title">${song.title}</div>
          <div class="song-artist">${song.artist}</div>
        `;
        
        menu.appendChild(item);
      });
      
      updateActiveSong();
    }
    
    // Load YouTube API
    const tag = document.createElement('script');
    tag.src = "https://www.youtube.com/iframe_api";
    const firstScriptTag = document.getElementsByTagName('script')[0];
    firstScriptTag.parentNode.insertBefore(tag, firstScriptTag);
  </script>
</body>
</html>
